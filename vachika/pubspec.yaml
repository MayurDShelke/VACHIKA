name: vachika
description: "VACHIKA — Every Expression Deserves a Voice. AI-powered two-way Indian Sign Language communication app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ──────────────────────────────────────────
  go_router: ^14.8.1

  # ── Networking / HTTP ───────────────────────────────────
  dio: ^5.8.0+1

  # ── Camera & Media ──────────────────────────────────────
  camera: ^0.11.1
  video_player: ^2.9.5
  record: ^7.2.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.6

  # ── Text-to-Speech ──────────────────────────────────────
  flutter_tts: ^4.2.1

  # ── Supabase (Auth + optional data) ─────────────────────
  supabase_flutter: ^2.10.2

  # ── Local Storage / Preferences ─────────────────────────
  shared_preferences: ^2.5.3

  # ── Typography (Inter font) ─────────────────────────────
  google_fonts: ^6.2.1

  # ── UI Utilities ────────────────────────────────────────
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  lottie: ^3.3.1
  gap: ^3.0.1

  # ── Utilities ───────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ── Code Generation ─────────────────────────────────────
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.6
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

